# Roadmap 086 C5c's lip course: a road made up to test the lip and the strips in Isaac, not a
# place. Built by the course builder as any course is (`python3 -m scensim_isaac_world.course
# courses/fixture_c5c.yaml <map dir>`); driven by `course.lip_drive`, judged by
# `course.lip_check` against `cases:` below, written before any run.
name: fixture_c5c
# A fixture's arbitrary datum, so the map frame and Autoware's projector work as for a real
# course. It names no place: nothing here was measured there.
origin: {lat: 36.0, lon: 140.0, alt: 0.0}
road:
  lanes: 2
  lane_width: 3.25
  shoulder: 2.0         # each side: wide enough for the right wheels, the left on the pavement
margin: 40.0
speed_limit_kmh: 60
fixture:
  grade: 0.0
  terrain_below: 0.40   # m: below the centreline, under the 15 cm lip's shoulder
  plan:
    - {straight: 2200.0}
  # eleven 200 m segments, each its own right lip (height and face held over the segment,
  # ramped over 2 m between), crown 2 % each side about the centreline
  crown: 0.02
  section:
    columns: [s, lip_h_right, lip_angle_right, runoff_len_right]
    rows:
      - [    0.0, 0.00,  90.0, 0.0]
      - [  199.0, 0.00,  90.0, 0.0]
      - [  201.0, 0.05,  90.0, 0.0]
      - [  399.0, 0.05,  90.0, 0.0]
      - [  401.0, 0.05,  45.0, 0.0]
      - [  599.0, 0.05,  45.0, 0.0]
      - [  601.0, 0.05,  30.0, 0.0]
      - [  799.0, 0.05,  30.0, 0.0]
      - [  801.0, 0.10,  90.0, 0.0]
      - [  999.0, 0.10,  90.0, 0.0]
      - [ 1001.0, 0.10,  45.0, 0.0]
      - [ 1199.0, 0.10,  45.0, 0.0]
      - [ 1201.0, 0.10,  30.0, 0.0]
      - [ 1399.0, 0.10,  30.0, 0.0]
      - [ 1401.0, 0.15,  90.0, 0.0]
      - [ 1599.0, 0.15,  90.0, 0.0]
      - [ 1601.0, 0.15,  45.0, 0.0]
      - [ 1799.0, 0.15,  45.0, 0.0]
      - [ 1801.0, 0.15,  30.0, 0.0]
      - [ 1999.0, 0.15,  30.0, 0.0]
      - [ 2001.0, 0.00,  90.0, 3.0]
      - [ 2200.0, 0.00,  90.0, 3.0]
  strips:
    - {from: 2000.0, to: 2200.0, side: right, shoulder_surface: gravel, runoff_surface: grass}
# Each segment's expected outcome on a re-entry over its lip, from the record's rule (roadmap
# 069's `lip` class: lip_h over about 5 cm and a face steeper than 45 deg holds a tyre on a
# shallow re-entry; any other re-enters). `boundary`: on the rule's edge, reported but counted
# neither as an agreement nor as a mismatch. Written 2026-11-23, before any run.
cases:
  - {segment: 0, from: 0.0, lip_h: 0.00, lip_angle: null, expect: re-enters}   # control: no lip
  - {segment: 1, from: 200.0, lip_h: 0.05, lip_angle: 90, expect: boundary}   # not over 5 cm, but about
  - {segment: 2, from: 400.0, lip_h: 0.05, lip_angle: 45, expect: re-enters}   # not over 5 cm
  - {segment: 3, from: 600.0, lip_h: 0.05, lip_angle: 30, expect: re-enters}   # not over 5 cm
  - {segment: 4, from: 800.0, lip_h: 0.10, lip_angle: 90, expect: held}   # over 5 cm, face steeper than 45 deg
  - {segment: 5, from: 1000.0, lip_h: 0.10, lip_angle: 45, expect: boundary}   # face at 45 deg, not steeper
  - {segment: 6, from: 1200.0, lip_h: 0.10, lip_angle: 30, expect: re-enters}   # face not steeper than 45 deg
  - {segment: 7, from: 1400.0, lip_h: 0.15, lip_angle: 90, expect: held}   # over 5 cm, face steeper than 45 deg
  - {segment: 8, from: 1600.0, lip_h: 0.15, lip_angle: 45, expect: boundary}   # face at 45 deg, not steeper
  - {segment: 9, from: 1800.0, lip_h: 0.15, lip_angle: 30, expect: re-enters}   # face not steeper than 45 deg
  - {segment: 10, from: 2000.0, lip_h: 0.00, lip_angle: null, expect: re-enters}   # strips: no lip; the right shoulder gravel, its run-off grass
